# Which model fills which role. Any provider can fill any role.

[roles]
student = "local"           # reads plain-language lines; asked on every new one, so keep it local
teacher = "claude"          # writes new commands; asked only when you say so

[providers.local]
kind = "openai"             # any server with the OpenAI chat API; scripts/serve.sh starts this one
url = "http://127.0.0.1:8080/v1"
model = "gemma-4-26B-A4B-it-qat-q4_0.gguf"

[providers.claude]
kind = "claude-cli"         # your own `claude` program and login
model = "claude-opus-5-5"
effort = "high"
